stages:
  - deploy

# Deploy Cloudflare Worker
deploy-worker:
  stage: deploy
  image: node:22-alpine
  script:
    - cd worker
    - npm ci
    - npx wrangler deploy
  environment:
    name: production
    url: https://cspiregaming-api.michaellamb.workers.dev
  only:
    - main
  # Required CI/CD variables (set in GitLab project settings, not committed):
  #   CLOUDFLARE_API_TOKEN  - Cloudflare API token with Workers:Edit permission
  #   CLOUDFLARE_ACCOUNT_ID - Your Cloudflare account ID

# Register Discord slash commands after a successful worker deploy. Discord's
# bulk-overwrite endpoint is idempotent, so this is safe to run on every push.
register-discord-commands:
  stage: deploy
  image: node:22-alpine
  needs: ["deploy-worker"]
  only:
    - main
  script:
    - cd worker
    - node scripts/register-commands.js
  variables:
    GUILD_ID: "379707231077138442"
  # Required CI/CD variables (Settings → CI/CD → Variables in csgit):
  #   DISCORD_APP_ID  - Discord application ID (public; safe to mark as masked but not protected)
  #   BOT_TOKEN       - Discord bot token (masked + protected). Must be set in GitLab even though
  #                     the worker runtime reads it as a wrangler secret — this job runs in its
  #                     own container and gets the token from CI vars, not from Cloudflare.

# Deploy Admin page to GitLab Pages (served at cspiregaming.csgitpages.cspire.net)
pages:
  stage: deploy
  script:
    - cp -r admin public
  artifacts:
    paths:
      - public
  only:
    - main
  environment:
    name: admin-page
    url: https://cspiregaming.csgitpages.cspire.net
