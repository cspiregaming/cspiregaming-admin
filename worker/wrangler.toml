name = "cspiregaming-api"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Non-secret config. Edit + redeploy to change.
[vars]
GUILD_ID = "379707231077138442"
# Discord role required to sign in to the admin console. Empty = any guild
# member can sign in (NOT recommended).
ADMIN_ROLE_ID = "961330657114607646"
ENVIRONMENT = "production"
# URL of the deployed admin SPA. Used as the post-OAuth redirect target so
# users land on the admin page (not the worker origin) after sign-in.
ADMIN_URL = "http://cspiregaming.csgitpages.cspire.net/cspiregaming-workers"
# Discord application ID — same value as DISCORD_CLIENT_ID secret, but public.
# Used by the slash-command registration script.
DISCORD_APP_ID = "1002285255249625138"
# Channel where event-publish-request approval messages get posted. Bot needs
# View Channel + Send Messages + Embed Links permissions here.
OFFICERS_CHANNEL_ID = "882367325939040286"
# Comma-separated list of role IDs allowed to use /request-event-publish
# (e.g. C Spire Employee + Mods). Members must hold at least one.
REQUESTER_ROLE_IDS = "379713136082550805,380805265815240705"
# Comma-separated list of role IDs allowed to run mod-only streamer admin
# commands (/streamer-list, /streamer-remove). ADMIN_ROLE_ID always passes
# this check too — officers don't need to be listed here. Members must hold
# at least one MOD_ROLE_IDS role OR the ADMIN_ROLE_ID role.
MOD_ROLE_IDS = "379713136082550805,1063322558562304141,961330657114607646"
# Role automatically granted to members who run /register-stream and complete
# the connections OAuth flow.
STREAMER_ROLE_ID = "REPLACE_WITH_STREAMER_ROLE_ID"
# Channel where Twitch live announcements get posted. Bot needs View Channel +
# Send Messages + Embed Links here.
LIVE_ANNOUNCE_CHANNEL_ID = "REPLACE_WITH_LIVE_ANNOUNCE_CHANNEL_ID"
# Optional override for the worker's public origin. Used to build the OAuth
# redirect URI for /register-stream and the Twitch EventSub callback URL.
# Defaults to https://api.cspiregaming.com.
# WORKER_ORIGIN = "https://api.cspiregaming.com"

routes = [
  { pattern = "api.cspiregaming.com", custom_domain = true },
]

[[kv_namespaces]]
binding = "CONFIG"
id = "cc9caa0873fb4a49a1ebd99d8c3e8ab0"
preview_id = "REPLACE_WITH_KV_PREVIEW_ID"

[[kv_namespaces]]
binding = "CONTENT"
id = "d321a0aae06745638e0324287ab0079c"
preview_id = "REPLACE_WITH_KV_PREVIEW_ID_2"

[[kv_namespaces]]
binding = "CACHE"
id = "d50b51116fca44c18c470fd59d3ab1c4"
preview_id = "REPLACE_WITH_KV_PREVIEW_ID_3"

# Secrets (set via `wrangler secret put <KEY>`, never committed):
#   BOT_TOKEN          - Discord bot token (GuildMembers intent required)
#   JWT_SECRET         - Random string for signing admin session JWTs and
#                        /register-stream OAuth state tokens.
#   DISCORD_CLIENT_ID  - Discord OAuth2 application client ID
#   DISCORD_CLIENT_SECRET - Discord OAuth2 application client secret
#   DISCORD_PUBLIC_KEY - Discord application Public Key (Developer Portal →
#                        General Information). Used to verify Ed25519 signatures
#                        on POST /api/interactions.
#   TWITCH_CLIENT_ID         - Twitch app Client ID (dev.twitch.tv → Apps).
#   TWITCH_CLIENT_SECRET     - Twitch app Client Secret. Used for the
#                              client_credentials grant that authorizes Helix
#                              + EventSub calls.
#   TWITCH_EVENTSUB_SECRET   - Random ≥10-char string. Shared HMAC secret used
#                              when creating EventSub subscriptions; the
#                              webhook handler verifies notification signatures
#                              with it.
